        -webkit-appearance: none;

      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #0077ff;
        cursor: pointer;
        border: 2px solid white;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.3);
      }

      input[type='range']::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #0077ff;
        cursor: pointer;
        border: 2px solid white;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.3);
      }

async function takeScreenshot() {

      c.height > 0

      let y = circle.centerY;
      if (window.DOTS && DOTS.getAnchorCoordinates) {
        const anchor = DOTS.getAnchorCoordinates(id);
        x -= anchor.x;
        y -= anchor.y;

      lines.push(`Radius: ${id} ${circle.radius.toFixed(2)}`);

      lines.push(`Polar angle: ${circle.polarAngle.toFixed(1)}°`);
      lines.push(
        `Spin: ${circle.spinAngle} / ${circle.spin} = ${+(
          (circle.spinAngle / circle.spin) %
          360
        ).toFixed(3)}°`
      );
      lines.push(`- - -- -- - -- -- - -- -- - -- -`);
    }
  });

  tempCtx.font = 'bold 16px "Segoe UI", Roboto, Arial, sans-serif';
  tempCtx.textBaseline = 'top';

  tempCtx.lineWidth = 3;

  for (let i = 0; i < lines.length; i++) {
    let textY = margin + i * lineHeight;
    tempCtx.strokeText(lines[i], margin, textY); 
    tempCtx.fillText(lines[i], margin, textY); 
  }
let now = new Date();
  let year = now.getFullYear();
  let month = String(now.getMonth() + 1).padStart(2, '0');
  let day = String(now.getDate()).padStart(2, '0');
  let hours = String(now.getHours()).padStart(2, '0');
  let minutes = String(now.getMinutes()).padStart(2, '0');

    (typeof rA !== 'undefined' && rA.include ? 1 : 0) +

    (typeof rC !== 'undefined' && rC.include ? 1 : 0) +
    (typeof rD !== 'undefined' && rD.include ? 1 : 0);

  const pngFilename = `${baseFilename}.png`;

  const stateJson = JSON.stringify(state, null, 2);

        stateManager.showNotification(`Saved ${savedFilename} and .json`, 'info');
      }

      console.error('Electron file save error:', err);
      stateManager.showNotification('Error saving files: ' + err.message, 'error');
    }
  } else {

const pngUrl = URL.createObjectURL(pngBlob);
      const pngLink = document.createElement('a');
      pngLink.href = pngUrl;
      pngLink.download = pngFilename;
      pngLink.click();
      URL.revokeObjectURL(pngUrl);

      const jsonUrl = URL.createObjectURL(jsonBlob);
      const jsonLink = document.createElement('a');
      jsonLink.href = jsonUrl;
      jsonLink.download = jsonFilename;
      jsonLink.click();

    });
  }
}
function updateAnglesInfo() {
  let parts = [];
  let partsHtml = [];
['A', 'B', 'C', 'D'].forEach((id) => {
    const circle = window[`r${id}`];
    if (circle && circle.include) {
      const val = +((circle.spinAngle / circle.spin) % 360).toFixed(3) + '°';
      parts.push(val);
      partsHtml.push(`<span style="color:${circle.color}">${val}</span>`);
    }
  });
const info = parts.join(' x ');
  const html = partsHtml.join(' <span style="color:#888">x</span> ');
if (window.helpPanel && helpPanel.updateHelpAnglesInfo) {
    helpPanel.updateHelpAnglesInfo(info, 'order');
  }

  if (oldAngleElement) {
    oldAngleElement.innerHTML = html;
  }
return info;
}
function centerViewOnGeometry() {
  let minX = Infinity,
    minY = Infinity,
    maxX = -Infinity,
    maxY = -Infinity;
  let hasVisibleCircles = false;
['A', 'B', 'C', 'D'].forEach((id) => {
    const circle = window[`r${id}`];
    if (circle && circle.include) {
      hasVisibleCircles = true;
      minX = Math.min(minX, circle.centerX - circle.radius);
      maxX = Math.max(maxX, circle.centerX + circle.radius);
      minY = Math.min(minY, circle.centerY - circle.radius);
      maxY = Math.max(maxY, circle.centerY + circle.radius);
    }
  });
let worldCenterX = 0;
  let worldCenterY = 0;
if (hasVisibleCircles) {
    worldCenterX = (minX + maxX) / 2;
    worldCenterY = (minY + maxY) / 2;
const bboxWidth = maxX - minX || 1;
    const bboxHeight = maxY - minY || 1;
const paddingFactor = 1.1;
const targetScaleX = (width - 2 * margin) / (bboxWidth * paddingFactor);
    const targetScaleY = (height - 2 * margin) / (bboxHeight * paddingFactor);
    const targetScale = Math.min(targetScaleX, targetScaleY);
const effectiveMaxDist = Math.max(bboxWidth, bboxHeight) / 2;
    const h = effectiveMaxDist * 2 * paddingFactor + 2;
zoom = height / (targetScale * h + 2 * margin);
  } else {
worldCenterX = 0;
    worldCenterY = 0;
    zoom = 0.9;
  }
xoff = -worldCenterX * scale * zoom;
  yoff = -worldCenterY * scale * zoom;
if (typeof doAnimation === 'function') doAnimation();
}

</script>
    <script>

const UNDO_LIMIT = 500;

          'polarAngle',
          'spin',
          'spinAngle',
          'color',

          cleanCircles[id] = {};
          fieldsToSave.forEach((field) => (cleanCircles[id][field] = DOTS.circles[id][field]));
        }
        return cleanCircles;
      })(),
      editingCircle: DOTS.editingCircle,
      settings: {
        zoom: zoom,
        xoff: xoff,
        yoff: yoff,
        useGrayscale: useGrayscale,
        pttype: pttype,
        mouseSensitivity: inputManager.mouseSensitivity,
        showInfoPanels: showInfoPanels,

    this.queues.low = [];

    let highLimit = this.config.frameBudget - timeSpent - bgReserve - lowReserve;
    if (highLimit > 0) {
      this._runQueue(this.queues.high, highLimit);
    }
timeSpent = performance.now() - frameStart;
    let lowLimit = this.config.frameBudget - timeSpent - bgReserve;
    if (lowLimit > 0) {
      this._runQueue(this.queues.low, lowLimit);
    }
timeSpent = performance.now() - frameStart;
let bgLimit = Math.max(bgReserve, this.config.frameBudget - timeSpent);
    if (bgLimit > 0) {

    }
requestAnimationFrame(this._tick);
  }
_runQueue(queue, timeLimit) {
    if (queue.length === 0) return;

    this.currentQueueLimit = timeLimit;
for (let i = 0; i < queue.length; i++) {

| :-- | :-- |

| \`Ctrl\` + \`V\` | Вставить состояние из буфера обмена.  |

## 3. Режимы отображения: В чем магия?
DOTS³ имеет несколько "движков" для рендеринга, которые переключаются горячими клавишами.
### Fast Chaos (клавиша \`D\`)
  - **Кратко:** Высокопроизводительный генеративный алгоритм, создающий узоры путем симуляции траектории точки, многократно "отражающейся" от границ окружностей.
  - **Принцип работы:** \`Fast Chaos\` - это режим по умолчанию, быстрый и зрелищный. Он рисует узор, трассируя траектории точек, которые многократно отражаются от границ окружностей. Идеально подходит для быстрого поиска красивых конфигураций. Это основа для создания сложных структур, например, для пазлов. Время и скорость вычисления (плотность и количество хаотичных точек) зависит от времени анимации и лимита максимальной длины траектории точек (order), устанавливаемых соответствующими кнопками на **Панели состояния и управления отображением**.
    - \`D\`: Переключает стиль точек (заливка, контур, маленькие точки).
    - \`W\`: Переключает между цветным и черно-белым режимом.
    - \`P\`: Генерирует новую случайную палитру заливки (только в цветном режиме).
### Slicer (клавиша \`J\`)
  - **Кратко:** Детерминированный движок вычислительной геометрии, который точно рассчитывает все пересечения, разбивая узор на граф из вершин (точек) и рёбер (дуг).
  - **Принцип работы:** \`Slicer\` — это "инженерный" режим. В отличие от \`FastChaos\`, он не симулирует траектории множества случайных точек, а выполняет точный геометрический расчет. Его цель — найти все реальные точки пересечения, дуги и замкнутые контуры, из которых состоит узор. Сложность узора определяется количеством **итераций**, устанавливаемых соответствующей кнопкой на **Панели состояния и управления отображением**.
    - \`J\`: Циклически переключает стили отображения: \`Выкл\` → \`Границы\` (показывает дуги) → \`Заливка\` (заливает контуры цветом) → \`Заливка + Номера точек\`.
### Layer Mixer (клавиша \`K\`)
  - **Кратко:** \`Layer Mixer\` — это генератор статичного изображения с эффектом наложения слоев.
  - **Принцип работы:** Генеративный процесс, создающий изображение путем многократного циклического поворота фрагментов изображения внутри каждой окружности. Он поочередно "поворачивает" содержимое каждой окружности, накладывая слои друг на друга. Сложность узора определяется количеством **итераций**, устанавливаемых соответствующей кнопкой на **Панели состояния и управления отображением**. Алгоритм работает следующим образом:
    1.  Берется первая активная окружность (например, **A**).
    2.  Содержимое изображения, находящееся внутри круга **A**, виртуально "вырезается".
    3.  Этот вырезанный фрагмент поворачивается на определенный угол.
    4.  Повернутый фрагмент вставляется обратно на то же место.
    5.  Этот процесс повторяется для следующей активной окружности (**B**, **C** и т.д.).
  - Весь цикл (проход по всем активным кругам) повторяется многократно. С каждым проходом изображение все больше "перемешивается", создавая сложный, переплетенный узор.
  - **Аналогия:** Это похоже на работу цифрового калейдоскопа или блендера. Вы задаете ингредиенты (круги и их параметры), а \`Layer Mixer\` автоматически смешивает их до получения финального "коктейля".
### Macro Rotator (клавиша \`L\`)
  - **Кратко:** Процедурный симулятор, который пошагово выполняет заданную пользователем последовательность команд вращения.
  - **Принцип работы:** Экспериментальный режим, в котором можно вручную установить параметры вращения окружностей для формирования узора взаимного пересечения. Формула вращения задается нажатием кнопки Sequence на **Панели состояния и управления отображением**. \`Macro Rotator\` — это исполнитель четких инструкций, а не генератор. Он работает не в цикле, а как симулятор пошаговых действий:
    1.  Вы вводите текстовую строку с командами, например \`A, B'3\` или \`1R, 2L3\`.
    2.  Парсер преобразует ее в конкретный список действий: \`[ {круг: A, направление: вправо, шаги: 1}, {круг: B, направление: влево, шаги: 3} ]\`.
    3.  Алгоритм берет первую команду из списка и выполняет ее (используя тот же механизм "вырезал, повернул, вставил").
    4.  После завершения первой команды он переходит ко второй и так далее, пока весь список не будет выполнен.
  - Цель — не создать узор, а визуализировать процесс и результат выполнения конкретной последовательности ходов.
  - **Формат команд:**
    - **Угол поворота** высчитывается исходя из параметров \`Spin angle\` и \`Spin\`;

## 3. Display Modes: What's the Magic?
DOTS³ has several rendering "engines" that can be switched with hotkeys.
### Fast Chaos (key \`D\`)
  - **In short:** A high-performance generative algorithm that creates patterns by simulating the trajectory of a point that repeatedly "reflects" off the boundaries of the circles.
  - **How it works:** \`Fast Chaos\` is the default mode, fast and spectacular. It draws a pattern by tracing the trajectories of points that repeatedly reflect off the boundaries of the circles. It is ideal for quickly finding beautiful configurations. This is the basis for creating complex structures, for example, for puzzles. The time and speed of calculation (density and number of chaotic points) depend on the animation time and the maximum trajectory length limit (order), which are set by the corresponding buttons on the **Status and Display Control Panel**.
    - \`D\`: Toggles the point style (fill, outline, small dots).
    - \`W\`: Toggles between color and black-and-white mode.
    - \`P\`: Generates a new random fill palette (only in color mode).
### Slicer (key \`J\`)
  - **In short:** A deterministic computational geometry engine that accurately calculates all intersections, breaking the pattern down into a graph of vertices (points) and edges (arcs).
  - **How it works:** \`Slicer\` is the "engineering" mode. Unlike \`FastChaos\`, it does not simulate the trajectories of many random points but performs an exact geometric calculation. Its goal is to find all real intersection points, arcs, and closed contours that make up the pattern. The complexity of the pattern is determined by the number of **iterations**, set by the corresponding button on the **Status and Display Control Panel**.
    - \`J\`: Cycles through display styles: \`Off\` → \`Borders\` (shows arcs) → \`Fill\` (fills contours with color) → \`Fill + Point Numbers\`.
### Layer Mixer (key \`K\`)
  - **In short:** \`Layer Mixer\` is a static image generator with a layer overlay effect.
  - **How it works:** A generative process that creates an image by repeatedly and cyclically rotating image fragments within each circle. It sequentially "rotates" the content of each circle, layering them on top of each other. The complexity of the pattern is determined by the number of **iterations**, set by the corresponding button on the **Status and Display Control Panel**. The algorithm works as follows:
    1.  The first active circle is taken (e.g., **A**).
    2.  The image content inside circle **A** is virtually "cut out".
    3.  This cut-out fragment is rotated by a certain angle.
    4.  The rotated fragment is pasted back into the same place.
    5.  This process is repeated for the next active circle (**B**, **C**, etc.).
  - The entire cycle (a pass through all active circles) is repeated many times. With each pass, the image becomes more "mixed," creating a complex, intertwined pattern.
  - **Analogy:** This is similar to how a digital kaleidoscope or a blender works. You provide the ingredients (circles and their parameters), and \`Layer Mixer\` automatically mixes them to get the final "cocktail".
### Macro Rotator (key \`L\`)
  - **In short:** A procedural simulator that step-by-step executes a user-defined sequence of rotation commands.
  - **How it works:** An experimental mode where you can manually set the rotation parameters of the circles to form a mutual intersection pattern. The rotation formula is set by pressing the Sequence button on the **Status and Display Control Panel**. \`Macro Rotator\` is an executor of clear instructions, not a generator. It works not in a loop, but as a simulator of step-by-step actions:
    1.  You enter a text string with commands, for example, \`A, B'3\` or \`1R, 2L3\`.
    2.  The parser converts it into a specific list of actions: \`[ {circle: A, direction: right, steps: 1}, {circle: B, direction: left, steps: 3} ]\`.
    3.  The algorithm takes the first command from the list and executes it (using the same "cut, rotate, paste" mechanism).
    4.  After completing the first command, it moves to the second, and so on, until the entire list is executed.
  - The goal is not to create a pattern, but to visualize the process and result of executing a specific sequence of moves.
  - **Command Format:**
    - The **rotation angle** is calculated based on the \`Spin angle\` and \`Spin\` parameters;
    - **A** or **1R** rotate circle 1 to the right (CW) by the **rotation angle**;
    - **C'** or **3L** rotate circle 3 to the left (CCW) by the **rotation angle**;
    - **B'3** or **2L3** rotate circle 2 to the left by the **rotation angle** 3 times;
    - **A, B'3** or **1R,2L3** rotate circle 1 to the right by the **rotation angle**; rotate circle 2 to the left by the **rotation angle** 3 times;
    - **(A,B)5** or **(1R,2R)5** rotate circle 1 to the right by the **rotation angle**; rotate circle 2 to the right by the **rotation angle**; repeat 5 times;
    - Nested parentheses are supported;
## 4. Workflow and Useful Tips
- Explore in "Fast Chaos" mode. This is the fastest way to find interesting geometry. Move markers, change radii and distances until you find something that catches your eye.
- Fine-tune with sliders. When you've found a good foundation, open the slider panel (\`Q\`) and perfect the parameters. Try setting \`Spin\` and \`Spin Angle\` to multiple values (e.g., \`Spin\`= 3, \`Spin Angle\`= 360 or 720) to create a variety of symmetries.
- If the centers of the circles coincide, the center marker is selected in the cycle by clicking on the stack of markers.
- Circle coordinates can be set in both polar and Cartesian coordinates. They will be recalculated upon change.
- Analyze in "Slicer" mode. Press \`J\` to see the real structure of your pattern. This will help you understand which areas are closed and how they interact.
- If "Slicer" has cut the pattern incorrectly (this can often happen in cyclical configurations, as well as when there are very small details) or if there are doubts about the "Fast Chaos" trajectories, you can set the rotation as a formula in "Macro Rotator" mode.
- More circles mean a more complex pattern. Position the anchor points wisely. During complex constructions, the anchor point can be changed to another with a recalculation of either the coordinates (while keeping it in place) or the location (while keeping the coordinates).
- More iterations mean longer calculation time; fewer iterations may result in an incomplete pattern.
- Save your work!
  - **\`Ctrl\` + \`S\`**: Exports the current state to a \`.json\` file. You can always load it back.
  - **\`S\`**: Takes a screenshot in \`.png\` and simultaneously saves a \`.json\` file with the same name. Ideal for not losing a great find.
  - **\`R\`**: You can return to the initial state by resetting the configurations to default settings.
  - Change history (\`Ctrl\`+\`Z\` / \`Ctrl\`+\`Y\`) is saved automatically, so don't be afraid to experiment.

    let inList = null; 
const closeList = () => {
      if (inList) {
        html += `</${inList}>`;
        inList = null;
      }
    };
for (let i = 0; i < lines.length; i++) {
      let line = lines[i];

const isUl = trimmedLine.startsWith('- ') || trimmedLine.startsWith('* ');
      const isOl = /^\d+\.\s/.test(trimmedLine);
if (trimmedLine.startsWith('|')) {
        closeList();
        if (!inTable) {
if (i + 1 < lines.length && lines[i + 1].trim().match(/^\|[:\s-]+\|/)) {
            html += '<table>';
const headers = trimmedLine

            html += '<thead><tr>';
            headers.forEach((h) => (html += `<th>${this._mdInline(h)}</th>`));
            html += '</tr></thead><tbody>';
            inTable = true;
            i++; 
          }
        } else {

          html += '<tr>';

        }
      } else {
        if (isUl || isOl) {
          if (inTable) {
            html += '</tbody></table>';
            inTable = false;
          }
          const listType = isUl ? 'ul' : 'ol';
          if (inList !== listType) {
            closeList();
            html += `<${listType}>`;
            inList = listType;
          }
          const itemText = isUl ? trimmedLine.substring(2) : trimmedLine.replace(/^\d+\.\s/, '');
          html += `<li>${this._mdInline(itemText)}</li>`;
          continue;
        }
closeList();
        if (inTable) {
          html += '</tbody></table>';
          inTable = false;
        }
        if (trimmedLine.startsWith('#### ')) {
          html += `<h4>${this._mdInline(trimmedLine.substring(5))}</h4>`;

          html += `<p>${this._mdInline(trimmedLine)}</p>`;
        }
      }
    }
if (inTable) {
      html += '</tbody></table>';
    }

return html;

            #helpModalContent ul, #helpModalContent ol { margin-left: 20px; line-height: 1.6; padding-left: 20px; }
            #helpModalContent li { margin-bottom: 8px; }
            #helpModalContent a { color: #64b5f6; text-decoration: none; } #helpModalContent a:hover { text-decoration: underline; }
            #helpModalContent table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
            #helpModalContent th, #helpModalContent td { padding: 8px 12px; border: 1px solid #444; text-align: left; }
            #helpModalContent th { background: rgba(40, 40, 40, 0.7); font-weight: 600; }
            #helpModalContent tr:nth-child(even) { background: rgba(255,255,255,0.03); }
            .help-tabs { display: flex; gap: 5px; padding: 0 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid #444; flex-shrink: 0; }
            .help-tab { padding: 10px 15px; cursor: pointer; border-bottom: 3px solid transparent; color: #aaa; transition: all 0.2s; }
            .help-tab:hover { color: #fff; background: rgba(255,255,255,0.05); }
            .help-tab.active { color: #4CAF50; border-bottom-color: #4CAF50; font-weight: bold; }
            .help-key {
                display: inline-block; background: #333; color: #fff; padding: 2px 8px;
                border-radius: 4px; border: 1px solid #555; font-family: 'Consolas', monospace;
                font-size: 12px; margin: 0 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.3);
            }
        `;
    document.head.appendChild(style);
const header = document.createElement('div'); 
    header.style.cssText = `display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(0, 0, 0, 0.4); border-bottom: 1px solid #444; cursor: move; user-select: none;`;
    const title = document.createElement('h2');
    title.textContent = 'DOTS³ - Help / Справка';
    title.style.cssText = `margin: 0; color: #4CAF50; font-size: 18px; border: none; padding: 0;`;
    const closeBtn = document.createElement('button');
    closeBtn.innerHTML = '×';
    closeBtn.style.cssText = `background: transparent; border: none; color: #aaa; font-size: 28px; cursor: pointer;`;
    closeBtn.onclick = () => this.hide();
    header.appendChild(title);
    header.appendChild(closeBtn);
this.tabContainer = document.createElement('div');
    this.tabContainer.className = 'help-tabs';
const guideTab = document.createElement('div');
    guideTab.className = 'help-tab';
    guideTab.dataset.tab = 'guide';
    guideTab.onclick = () => this._switchTab('guide');
const hotkeysTab = document.createElement('div');
    hotkeysTab.className = 'help-tab';
    hotkeysTab.dataset.tab = 'hotkeys';
    hotkeysTab.onclick = () => this._switchTab('hotkeys');
const aboutTab = document.createElement('div');
    aboutTab.className = 'help-tab';
    aboutTab.dataset.tab = 'about';
    aboutTab.onclick = () => this._switchTab('about');
this.tabContainer.appendChild(guideTab);
    this.tabContainer.appendChild(hotkeysTab);
    this.tabContainer.appendChild(aboutTab);
this.contentDiv = document.createElement('div');
    this.contentDiv.id = 'helpModalContent';
const footer = document.createElement('div');
    footer.style.cssText = `padding: 10px 20px; background: rgba(0, 0, 0, 0.4); border-top: 1px solid #444; text-align: right;`;
    this.langToggle = document.createElement('button');
    this.langToggle.style.cssText = `padding: 6px 12px; background: #555; color: white; border: 1px solid #777; border-radius: 4px; cursor: pointer;`;
    this.langToggle.onclick = () => this.toggleLanguage();
    footer.appendChild(this.langToggle);
this.modal.appendChild(header);
    this.modal.appendChild(this.tabContainer);
    this.modal.appendChild(this.contentDiv);
    this.modal.appendChild(footer);
document.body.appendChild(this.overlay);
    document.body.appendChild(this.modal);
if (typeof makeDraggable === 'function') {
      makeDraggable(this.modal, header);
    }
  }
show() {
    if (!this.modal) this._createUI();
    if (!this.modal) return;
this.modal.style.display = 'flex';
    this.overlay.style.display = 'block';
    this.isVisible = true;
    document.body.style.overflow = 'hidden';
    this._switchTab(this.currentTab); 
  }
hide() {
    if (!this.modal) return;
    this.modal.style.display = 'none';
    this.overlay.style.display = 'none';
    this.isVisible = false;
    document.body.style.overflow = '';
  }
_renderContent() {
    if (this.contentDiv) {
      let content = '';
      if (this.currentTab === 'guide') {
        content = this.helpData['guide_' + this.currentLang] || '<p>Loading guide...</p>';
      } else if (this.currentTab === 'hotkeys') {
        content = this.helpData[this.currentLang] || `<p>Loading hotkeys...</p>`;
      } else if (this.currentTab === 'about') {
        content = this.helpData['about_' + this.currentLang] || `<p>Loading about info...</p>`;
      }
      this.contentDiv.innerHTML = content.replace(/%%APP_VERSION%%/g, window.APP_VERSION || 'N/A');
    }
if (this.langToggle) {
      this.langToggle.textContent =
        this.currentLang === 'ru' ? 'Switch to English' : 'Переключить на Русский';
    }
    if (this.tabContainer) {
      const guideTab = this.tabContainer.querySelector('[data-tab="guide"]');
      const hotkeysTab = this.tabContainer.querySelector('[data-tab="hotkeys"]');
      const aboutTab = this.tabContainer.querySelector('[data-tab="about"]');
if (guideTab) guideTab.textContent = this.currentLang === 'ru' ? 'Руководство' : 'User Guide';
      if (hotkeysTab)
        hotkeysTab.textContent = this.currentLang === 'ru' ? 'Горячие клавиши' : 'Hotkeys';
      if (aboutTab) aboutTab.textContent = this.currentLang === 'ru' ? 'О программе' : 'About';
    }
  }
toggleLanguage() {
    this.currentLang = this.currentLang === 'ru' ? 'en' : 'ru';
    localStorage.setItem('helpLang', this.currentLang);
    this._renderContent();
  }
_switchTab(tabName) {
    this.currentTab = tabName;
    localStorage.setItem('helpTab', tabName);
    if (this.tabContainer) {
      this.tabContainer.querySelectorAll('.help-tab').forEach((tab) => {
        if (tab.dataset.tab === tabName) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      });
    }
    this._renderContent();
  }
}
const helpSystem = new HelpModalSystem();
window.helpModal = {
  showFullHelpModal: () => helpSystem.show(),
  closeHelpModal: () => helpSystem.hide(),
  isHelpModalOpen: () => helpSystem.isVisible,
};

</script>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        start();
      });
    </script>
  </body>
